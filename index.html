<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#26382f">
<title>Our Table</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap');

:root {
  --cream: #f6f2e9;
  --paper: #fffdf8;
  --espresso: #292a25;
  --forest: #26382f;
  --olive: #687252;
  --terracotta: #a86148;
  --ochre: #b58c4a;
  --blue: #526772;
  --muted: #77766e;
  --line: #ded7ca;
  --soft-green: #e7e9df;
  --soft-terra: #f0e3dc;
  --shadow: 0 8px 30px rgba(45,40,30,.07);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--espresso);
  font-family: "DM Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 760px;
  min-height: 100vh;
  margin: 0 auto;
  padding-bottom: 90px;
}

/* HEADER */

header {
  padding: 27px 22px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  color: var(--forest);
  font-family: "Libre Baskerville", serif;
  font-size: 25px;
  letter-spacing: -.5px;
}

.brand-subtitle {
  display: block;
  margin-top: 6px;
  color: var(--olive);
  font-family: "DM Sans", sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.header-mark {
  width: 42px;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--forest);
  font-size: 20px;
}

/* VIEWS */

.view {
  display: none;
  padding: 4px 22px 30px;
}

.view.active {
  display: block;
}

/* TYPE */

.eyebrow {
  margin-bottom: 7px;
  color: var(--olive);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
}

h1,
h2,
h3 {
  margin: 0;
  font-family: "Libre Baskerville", serif;
  font-weight: 400;
}

h1 {
  font-size: 30px;
  line-height: 1.2;
  letter-spacing: -.5px;
}

h2 {
  font-size: 20px;
}

.page-header {
  margin: 12px 0 25px;
}

.page-subtitle {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}

/* BUTTONS */

.primary-button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  background: var(--forest);
  color: white;
  font-weight: 600;
}

.secondary-button {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 15px;
  background: var(--paper);
  color: var(--forest);
  font-weight: 600;
}

.text-button {
  border: none;
  padding: 4px 0;
  background: transparent;
  color: var(--olive);
  font-size: 13px;
}

/* ADD RECIPE */

.add-recipe-card {
  margin-bottom: 27px;
  padding: 19px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--forest);
  color: white;
  box-shadow: var(--shadow);
}

.add-recipe-card h2 {
  font-size: 20px;
}

.add-recipe-card p {
  margin: 7px 0 15px;
  color: #d9ded8;
  font-size: 12px;
  line-height: 1.5;
}

.url-row {
  display: flex;
  gap: 8px;
}

.url-input {
  min-width: 0;
  flex: 1;
  border: none;
  border-radius: 9px;
  padding: 12px;
  background: rgba(255,255,255,.96);
  color: var(--espresso);
  outline: none;
}

.url-input::placeholder {
  color: #99978f;
}

.import-button {
  flex: 0 0 auto;
  border: none;
  border-radius: 9px;
  padding: 0 14px;
  background: var(--terracotta);
  color: white;
  font-weight: 600;
}

/* MEAL CARDS */

.meal-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.meal-card {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 16px 17px;
  background: var(--paper);
  display: grid;
  grid-template-columns: 60px 1fr 20px;
  align-items: center;
  gap: 14px;
  text-align: left;
  color: var(--espresso);
  box-shadow: 0 2px 9px rgba(40,35,25,.025);
  transition: .16s ease;
}

.meal-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.day {
  color: var(--olive);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.day-number {
  display: block;
  margin-top: 4px;
  color: var(--espresso);
  font-family: "Libre Baskerville", serif;
  font-size: 20px;
}

.meal-name {
  font-family: "Libre Baskerville", serif;
  font-size: 16px;
  line-height: 1.4;
}

.meal-description {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.arrow {
  color: var(--terracotta);
  font-family: Georgia, serif;
  font-size: 24px;
}

/* RECIPE BOX */

.recipe-box-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.recipe-box-card {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 16px 17px;
  background: var(--paper);
  text-align: left;
  color: var(--espresso);
}

.recipe-box-card .recipe-box-name {
  font-family: "Libre Baskerville", serif;
  font-size: 16px;
}

.recipe-box-card .recipe-box-meta {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
}

/* RECIPE DETAIL */

.back-button {
  border: none;
  background: transparent;
  padding: 6px 0 22px;
  color: var(--olive);
  font-size: 14px;
}

.detail-kicker {
  margin-bottom: 9px;
  color: var(--olive);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

.detail-title {
  font-size: 30px;
  line-height: 1.2;
}

.detail-description {
  margin: 12px 0 18px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

.recipe-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 26px;
}

.recipe-meta span {
  padding: 7px 10px;
  border-radius: 20px;
  background: var(--soft-green);
  color: var(--forest);
  font-size: 12px;
}

.recipe-section {
  margin-top: 23px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.recipe-section h2 {
  margin-bottom: 12px;
}

.ingredients {
  list-style: none;
  padding: 0;
  margin: 0;
}

.ingredients li {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 9px 0;
  border-bottom: 1px solid #ebe5da;
  font-size: 14px;
}

.ingredients li span:last-child {
  color: var(--muted);
  text-align: right;
}

.directions {
  list-style: none;
  padding: 0;
  margin: 0;
  counter-reset: recipe-step;
}

.directions li {
  position: relative;
  counter-increment: recipe-step;
  padding: 0 0 22px 44px;
  font-size: 14px;
  line-height: 1.65;
}

.directions li::before {
  content: counter(recipe-step);
  position: absolute;
  top: 0;
  left: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--forest);
  color: white;
  font-size: 12px;
  line-height: 28px;
  text-align: center;
}

.directions strong {
  display: block;
  margin-bottom: 3px;
  font-family: "Libre Baskerville", serif;
  font-size: 15px;
  font-weight: 400;
}

/* ASSIGN */

.assign-box {
  margin-top: 24px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--paper);
}

.assign-box label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 12px;
}

.assign-row {
  display: flex;
  gap: 8px;
}

.day-select {
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px;
  background: white;
}

/* GROCERY */

.grocery-group {
  margin-bottom: 12px;
  padding: 17px 18px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--paper);
}

.grocery-group h2 {
  margin-bottom: 9px;
}

.grocery-item {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 39px;
  border-bottom: 1px solid #ebe5da;
  font-size: 14px;
}

.grocery-item:last-child {
  border-bottom: none;
}

.grocery-item input {
  appearance: none;
  width: 19px;
  height: 19px;
  margin: 0;
  border: 1px solid #aaa398;
  border-radius: 50%;
}

.grocery-item input:checked {
  position: relative;
  border-color: var(--forest);
  background: var(--forest);
}

.grocery-item input:checked::after {
  content: "✓";
  position: absolute;
  left: 4px;
  top: 0;
  color: white;
  font-size: 12px;
}

.grocery-item:has(input:checked) span {
  color: #aaa;
  text-decoration: line-through;
}

/* EMPTY */

.empty {
  padding: 30px 10px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
}

/* NAV */

.bottom-nav {
  position: fixed;
  z-index: 20;
  bottom: 0;
  left: 50%;
  width: min(760px,100%);
  transform: translateX(-50%);
  display: flex;
  justify-content: space-around;
  padding: 9px 8px max(10px,env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: rgba(255,253,248,.96);
  backdrop-filter: blur(12px);
}

.nav-button {
  border: none;
  background: transparent;
  padding: 4px 18px;
  color: #8b887f;
  font-size: 10px;
}

.nav-icon {
  display: block;
  margin-bottom: 3px;
  font-size: 20px;
}

.nav-button.active {
  color: var(--forest);
  font-weight: 600;
}

@media (min-width:650px) {
  .app {
    padding-left: 20px;
    padding-right: 20px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    Our Table
    <span class="brand-subtitle">Family meal planner</span>
  </div>

  <div class="header-mark">⌂</div>
</header>

<!-- WEEK -->
<section id="weekView" class="view active">

  <div class="page-header">
    <div class="eyebrow">This week</div>
    <h1>What we're eating</h1>
    <div class="page-subtitle">October 5 — October 11</div>
  </div>

  <div id="mealList" class="meal-list"></div>

</section>

<!-- RECIPE BOX -->
<section id="recipesView" class="view">

  <div class="page-header">
    <div class="eyebrow">Your collection</div>
    <h1>Recipe box</h1>
    <div class="page-subtitle">Recipes you've saved to Our Table</div>
  </div>

  <div class="add-recipe-card">
    <h2>Add a recipe</h2>
    <p>Paste a URL or add one manually to your collection.</p>
    <div class="url-row">
      <input id="recipeUrl" class="url-input" type="url" placeholder="Paste recipe URL">
      <button class="import-button" onclick="importRecipe()">Add</button>
    </div>
  </div>

  <div id="recipeBoxList" class="recipe-box-list"></div>

</section>

<!-- GROCERY -->
<section id="groceryView" class="view">

  <div class="page-header">
    <div class="eyebrow">From this week's meals</div>
    <h1>Grocery list</h1>
    <div class="page-subtitle">Generated from the recipes on your week</div>
  </div>

  <div id="groceryList"></div>

</section>

<!-- RECIPE -->
<section id="recipeView" class="view">
  <button class="back-button" onclick="showView('week')">← Back</button>
  <div id="recipeContent"></div>
</section>

</div>

<nav class="bottom-nav">
  <button id="weekNav" class="nav-button active" onclick="showView('week')"><span class="nav-icon">⌂</span>Week</button>
  <button id="recipesNav" class="nav-button" onclick="showView('recipes')"><span class="nav-icon">▢</span>Recipes</button>
  <button id="groceryNav" class="nav-button" onclick="showView('grocery')"><span class="nav-icon">□</span>Grocery</button>
</nav>

<!-- Supabase client (optional) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const dayNames = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
let selectedDay = null;

const defaultRecipes = [
  { id: "hidden-veggie-pasta", name: "Hidden Veggie Pasta", description: "creamy marinara · roasted vegetables · parmesan", time: "35 min", servings: "4", ingredients: [["Pasta","12 oz"],["Zucchini","1 medium"],["Carrot","1 large"],["Bell pepper","1"],["Marinara sauce","24 oz"],["Parmesan","½ cup"],["Olive oil","2 tbsp"]], directions: [["Roast the vegetables","Heat the oven to 425°F. Chop the zucchini, carrot, and bell pepper. Toss with olive oil and roast for 20–25 minutes until tender."],["Cook the pasta","Boil salted water and cook the pasta according to the package directions. Reserve about ½ cup pasta water, then drain."],["Make the sauce","Blend the roasted vegetables with the marinara until smooth. Add a splash of pasta water if needed."],["Bring it together","Toss the pasta with the sauce and parmesan. Loosen with reserved pasta water as needed."]] },
  { id: "black-bean-bowls", name: "Black Bean + Sweet Potato Bowls", description: "roasted sweet potatoes · black beans · avocado", time: "40 min", servings: "4", ingredients: [["Sweet potatoes","3"],["Black beans","2 cans"],["Quinoa","1 cup"],["Avocados","2"],["Lime","2"],["Olive oil","2 tbsp"],["Cumin","1 tsp"]], directions: [["Roast the sweet potatoes","Heat oven to 425°F. Cube sweet potatoes, toss with olive oil and cumin, and roast 25–30 minutes."],["Cook the quinoa","Combine quinoa with 2 cups water. Simmer covered about 15 minutes, then fluff."],["Warm the beans","Drain and rinse the beans. Warm gently with cumin, salt, pepper, and lime."],["Assemble","Divide quinoa between bowls and top with sweet potatoes, beans, avocado, and lime."]] },
  { id: "leftovers", name: "Leftovers + Sandwiches", description: "use what is already in the fridge", time: "—", servings: "as needed", ingredients: [["Leftovers","as needed"],["Bread or wraps","as needed"],["Fresh fruit","as needed"]], directions: [["Check the fridge","Start with anything that needs to be used first."],["Build dinner","Make sandwiches, wraps, or simple plates around what you already have."],["Add something fresh","Serve with fruit or vegetables."]] },
  { id: "mediterranean-chickpea-pitas", name: "Mediterranean Chickpea Pitas", description: "crispy chickpeas · cucumber · feta · lemon", time: "25 min", servings: "4", ingredients: [["Chickpeas","2 cans"],["Pitas","4"],["Cucumber","1"],["Tomatoes","2"],["Feta","4 oz"],["Lemon","1"],["Greek yogurt","½ cup"],["Olive oil","2 tbsp"]], directions: [["Crisp the chickpeas","Drain and dry chickpeas. Season and air fry at 400°F for 12–15 minutes, shaking halfway."],["Make the salad","Dice cucumber and tomatoes. Toss with lemon, olive oil, salt, and pepper. Add feta."],["Make the sauce","Stir Greek yogurt with lemon juice and a splash of water."],["Fill the pitas","Warm pitas and fill with salad and crispy chickpeas. Drizzle with yogurt sauce."]] },
  { id: "pizza-night", name: "Pizza Night", description: "everyone gets to choose their toppings", time: "20 min", servings: "4", ingredients: [["Pizza dough or crusts","2"],["Pizza sauce","1 cup"],["Mozzarella","8 oz"],["Favorite toppings","as needed"]], directions: [["Heat the oven","Follow the dough or crust package temperature, usually around 450–500°F."],["Build the pizzas","Spread sauce over the crusts and add mozzarella and toppings."],["Bake","Bake until the crust is crisp and the cheese is bubbling."]] },
  { id: "coconut-shrimp", name: "Coconut Shrimp", description: "crispy coconut coating · lime · rice", time: "30 min", servings: "4", ingredients: [["Shrimp","1 lb"],["Shredded coconut","1 cup"],["Panko","1 cup"],["Eggs","2"],["Flour","½ cup"],["Lime","1"],["Rice","1½ cups"]], directions: [["Set up the coating","Place flour, beaten eggs, and coconut mixed with panko in three separate bowls."],["Coat the shrimp","Dip shrimp in flour, then egg, then coconut-panko mixture."],["Cook","Air fry at 400°F for 8-10 minutes, turning halfway."],["Serve","Serve with rice and lime wedges."]] },
  { id: "chicken-white-bean-soup", name: "Chicken + White Bean Soup", description: "cozy, brothy, and made for leftovers", time: "50 min", servings: "6", ingredients: [["Chicken breast","1 lb"],["Cannellini beans","2 cans"],["Carrots","2"],["Celery","2 stalks"],["Onion","1"],["Chicken broth","6 cups"],["Spinach","3 cups"],["Italian seasoning","1 tbsp"]], directions: [["Sauté the vegetables","Cook diced onion, carrots, and celery in olive oil until softened."],["Simmer","Add broth, beans, seasoning, and chicken. Simmer until chicken is cooked through."],["Shred the chicken","Remove chicken, shred with two forks, and return it to the pot."],["Finish","Stir in spinach and simmer until wilted."]] }
];

const defaultWeek = { Monday: "hidden-veggie-pasta", Tuesday: "black-bean-bowls", Wednesday: "leftovers", Thursday: "mediterranean-chickpea-pitas", Friday: "pizza-night", Saturday: "coconut-shrimp", Sunday: "chicken-white-bean-soup" };

function getCurrentWeekInfo() {
  const now = new Date();
  const dayIndex = now.getDay();
  const mondayOffset = dayIndex === 0 ? -6 : 1 - dayIndex;
  const monday = new Date(now);
  monday.setDate(now.getDate() + mondayOffset);

  const days = dayNames.map((name, idx) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + idx);
    return { name, dayNumber: d.getDate(), date: d };
  });

  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);

  return { monday, sunday, days };
}

function updateWeekSubtitle() {
  const subtitle = document.querySelector('#weekView .page-subtitle');
  if (!subtitle) return;
  const { monday, sunday } = getCurrentWeekInfo();
  const fmt = (d) => d.toLocaleString('en-US', { month: 'short' });
  subtitle.textContent = `${fmt(monday)} ${monday.getDate()} — ${fmt(sunday)} ${sunday.getDate()}`;
}

function loadRecipes() {
  const saved = localStorage.getItem('ourTableRecipes');
  if (saved) return JSON.parse(saved);
  localStorage.setItem('ourTableRecipes', JSON.stringify(defaultRecipes));
  return [...defaultRecipes];
}

function loadWeek() {
  const saved = localStorage.getItem('ourTableWeek');
  if (saved) return JSON.parse(saved);
  localStorage.setItem('ourTableWeek', JSON.stringify(defaultWeek));
  return { ...defaultWeek };
}

let recipes = loadRecipes();
let week = loadWeek();

async function saveAll() {
  localStorage.setItem('ourTableRecipes', JSON.stringify(recipes));
  localStorage.setItem('ourTableWeek', JSON.stringify(week));

  if (typeof window !== 'undefined' && window._supabaseClient) {
    try {
      await window._supabaseClient.from('recipes').upsert(recipes, { onConflict: 'id' });
    } catch (e) {
      console.warn('Failed to save recipes to Supabase', e);
    }

    try {
      await window._supabaseClient.from('weeks').upsert([{ id: 'default', plan: week }], { onConflict: 'id' });
    } catch (e) {
      console.warn('Failed to save week to Supabase', e);
    }
  }
}

function renderWeek() {
  const { days } = getCurrentWeekInfo();
  const list = document.getElementById('mealList');

  list.innerHTML = days.map(day => {
    const recipe = recipes.find(r => r.id === week[day.name]);

    if (!recipe) {
      return `
        <button class="meal-card" onclick="showRecipesForDay('${day.name}')">
          <div class="day">${day.name.slice(0,3)}<span class="day-number">${day.dayNumber}</span></div>
          <div>
            <div class="meal-name">Choose a recipe</div>
            <div class="meal-description">Tap to select from your recipe box</div>
          </div>
          <div class="arrow">›</div>
        </button>
      `;
    }

    return `
      <button class="meal-card" onclick="openRecipe('${recipe.id}')">
        <div class="day">${day.name.slice(0,3)}<span class="day-number">${day.dayNumber}</span></div>
        <div>
          <div class="meal-name">${recipe.name}</div>
          <div class="meal-description">${recipe.description || ''}</div>
        </div>
        <div class="arrow">›</div>
      </button>
    `;
  }).join('');
}

function renderRecipeBox() {
  const list = document.getElementById('recipeBoxList');
  if (!recipes.length) {
    list.innerHTML = '<div class="empty">Your recipe box is empty.</div>';
    return;
  }

  let heading = '';
  if (selectedDay) {
    heading = `<div class="empty" style="padding-top:0;padding-bottom:10px;">Assigning a recipe to ${selectedDay}.</div>`;
  }

  list.innerHTML = heading + recipes.map(recipe => `
    <button class="recipe-box-card" onclick="${selectedDay ? `assignRecipeToSelectedDay('${recipe.id}')` : `openRecipe('${recipe.id}')`}">
      <div class="recipe-box-name">${recipe.name}</div>
      <div class="recipe-box-meta">${recipe.time || 'Recipe'} · ${recipe.servings ? `serves ${recipe.servings}` : 'saved recipe'}</div>
    </button>
  `).join('');
}

function showRecipesForDay(day) {
  selectedDay = day;
  renderRecipeBox();
  showView('recipes');
}

function assignRecipeToSelectedDay(id) {
  if (!selectedDay) {
    openRecipe(id);
    return;
  }

  week[selectedDay] = id;
  saveAll();
  renderWeek();
  renderGrocery();
  selectedDay = null;
  showView('week');
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}

function openRecipe(id) {
  const recipe = recipes.find(r => r.id === id);
  if (!recipe) return;

  document.getElementById('recipeContent').innerHTML = `
    <div class="detail-kicker">Recipe</div>
    <h2 class="detail-title">${escapeHtml(recipe.name)}</h2>
    ${recipe.description ? `<div class="detail-description">${escapeHtml(recipe.description)}</div>` : ''}
    <div class="recipe-meta">
      ${recipe.time ? `<span>${escapeHtml(recipe.time)}</span>` : ''}
      ${recipe.servings ? `<span>Serves ${escapeHtml(recipe.servings)}</span>` : ''}
    </div>

    <div style="display:flex; gap:8px; margin-bottom:8px;">
      <button class="secondary-button" onclick="showEditRecipeForm('${recipe.id}')">Edit</button>
      <button class="text-button" onclick="deleteRecipePrompt('${recipe.id}')">Delete</button>
    </div>

    <div class="recipe-section">
      <h2>Ingredients</h2>
      <ul class="ingredients">
        ${(recipe.ingredients || []).map(item => `
          <li>
            <span>${escapeHtml(item[0])}</span>
            <span>${escapeHtml(item[1])}</span>
          </li>
        `).join('')}
      </ul>
    </div>

    <div class="recipe-section">
      <h2>Directions</h2>
      <ol class="directions">
        ${(recipe.directions || []).map(step => `
          <li>
            <strong>${escapeHtml(step[0])}</strong>
            ${escapeHtml(step[1])}
          </li>
        `).join('')}
      </ol>
    </div>

    <div class="assign-box">
      <label>Add this recipe to your week</label>
      <div class="assign-row">
        <select id="assignDay" class="day-select">
          ${dayNames.map(name => `<option>${name}</option>`).join('')}
        </select>
        <button class="primary-button" onclick="assignRecipe('${recipe.id}')">Add</button>
      </div>
    </div>
  `;

  showView('recipe');
}

function showEditRecipeForm(id) {
  const recipe = recipes.find(r => r.id === id);
  if (!recipe) return;

  document.getElementById('recipeContent').innerHTML = `
    <div class="detail-kicker">Edit recipe</div>
    <label style="display:block; margin:12px 0 6px; color:#666; font-size:12px;">Name</label>
    <input id="edit_name" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;" value="${escapeHtml(recipe.name)}">

    <label style="display:block; margin:12px 0 6px; color:#666; font-size:12px;">Description</label>
    <input id="edit_description" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;" value="${escapeHtml(recipe.description || '')}">

    <label style="display:block; margin:12px 0 6px; color:#666; font-size:12px;">Time</label>
    <input id="edit_time" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;" value="${escapeHtml(recipe.time || '')}">

    <label style="display:block; margin:12px 0 6px; color:#666; font-size:12px;">Servings</label>
    <input id="edit_servings" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;" value="${escapeHtml(recipe.servings || '')}">

    <div style="display:flex; gap:8px; margin-top:16px;">
      <button class="primary-button" onclick="saveEditedRecipe('${recipe.id}')">Save</button>
      <button class="secondary-button" onclick="openRecipe('${recipe.id}')">Cancel</button>
    </div>
  `;
}

function saveEditedRecipe(id) {
  const recipe = recipes.find(r => r.id === id);
  if (!recipe) return;

  recipe.name = document.getElementById('edit_name').value.trim() || recipe.name;
  recipe.description = document.getElementById('edit_description').value.trim();
  recipe.time = document.getElementById('edit_time').value.trim();
  recipe.servings = document.getElementById('edit_servings').value.trim();

  saveAll();
  renderRecipeBox();
  renderWeek();
  renderGrocery();
  openRecipe(id);
}

function deleteRecipePrompt(id) {
  if (!confirm('Delete this recipe? This cannot be undone.')) return;
  deleteRecipe(id);
}

function deleteRecipe(id) {
  const index = recipes.findIndex(r => r.id === id);
  if (index === -1) return;

  recipes.splice(index, 1);
  Object.keys(week).forEach(day => {
    if (week[day] === id) week[day] = null;
  });

  if (window._supabaseClient) {
    window._supabaseClient.from('recipes').delete().eq('id', id).catch(err => {
      console.warn('Failed to delete recipe from Supabase', err);
    });
  }

  saveAll();
  renderWeek();
  renderRecipeBox();
  renderGrocery();
  showView('recipes');
}

function assignRecipe(id) {
  const day = document.getElementById('assignDay').value;
  week[day] = id;
  saveAll();
  renderWeek();
  renderGrocery();
  showView('week');
}

function renderGrocery() {
  const container = document.getElementById('groceryList');
  const ingredients = {};

  Object.values(week).filter(Boolean).forEach(recipeId => {
    const recipe = recipes.find(r => r.id === recipeId);
    if (!recipe) return;

    (recipe.ingredients || []).forEach(item => {
      const name = item[0];
      const quantity = item[1];
      if (!ingredients[name]) ingredients[name] = [];
      ingredients[name].push(quantity);
    });
  });

  if (!Object.keys(ingredients).length) {
    container.innerHTML = '<div class="empty">Add some recipes to your week and your grocery list will appear here.</div>';
    return;
  }

  container.innerHTML = `
    <div class="grocery-group">
      <h2>Everything we need</h2>
      ${Object.entries(ingredients).map(([name, quantities], index) => `
        <label class="grocery-item">
          <input type="checkbox" data-grocery="${index}">
          <span>${quantities.join(' + ')} ${name}</span>
        </label>
      `).join('')}
    </div>
  `;
}

function importRecipe() {
  const input = document.getElementById('recipeUrl');
  const url = (input && input.value || '').trim();

  if (url) {
    alert('Recipe URL import is not connected yet in this build. Use the manual add flow or come back when the backend is connected.');
    return;
  }

  const name = window.prompt('Recipe name:');
  if (!name || !name.trim()) return;

  const description = window.prompt('Short description (optional):', '');
  const time = window.prompt('Time (optional):', '');
  const servings = window.prompt('Servings (optional):', '');

  const id = 'recipe-' + Date.now();
  const recipe = {
    id,
    name: name.trim(),
    description: description ? description.trim() : '',
    time: time ? time.trim() : '',
    servings: servings ? servings.trim() : '',
    ingredients: [],
    directions: [],
    sourceUrl: ''
  };

  recipes.push(recipe);
  if (selectedDay) {
    week[selectedDay] = id;
    selectedDay = null;
  }

  saveAll();
  renderWeek();
  renderRecipeBox();
  renderGrocery();
  openRecipe(id);
}

function saveImportedRecipe(importedRecipe) {
  const id = 'recipe-' + Date.now();
  const recipe = {
    id,
    name: importedRecipe.name,
    description: importedRecipe.description || '',
    time: importedRecipe.time || '',
    servings: importedRecipe.servings || '',
    ingredients: importedRecipe.ingredients || [],
    directions: importedRecipe.directions || [],
    sourceUrl: importedRecipe.sourceUrl || ''
  };

  recipes.push(recipe);
  saveAll();
  renderRecipeBox();
  openRecipe(id);
}

function showView(view) {
  document.querySelectorAll('.view').forEach(section => section.classList.remove('active'));

  if (view === 'week') document.getElementById('weekView').classList.add('active');
  if (view === 'recipes') document.getElementById('recipesView').classList.add('active');
  if (view === 'grocery') document.getElementById('groceryView').classList.add('active');
  if (view === 'recipe') document.getElementById('recipeView').classList.add('active');

  document.querySelectorAll('.nav-button').forEach(button => button.classList.remove('active'));

  if (view === 'week') document.getElementById('weekNav').classList.add('active');
  if (view === 'recipes') document.getElementById('recipesNav').classList.add('active');
  if (view === 'grocery') document.getElementById('groceryNav').classList.add('active');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function ensureNavBindings() {
  const navMap = { weekNav: 'week', recipesNav: 'recipes', groceryNav: 'grocery' };
  Object.entries(navMap).forEach(([key, value]) => {
    const el = document.getElementById(key);
    if (!el || el.dataset.bound === 'true') return;
    el.addEventListener('click', () => showView(value));
    el.dataset.bound = 'true';
  });
}

renderWeek();
renderRecipeBox();
renderGrocery();
updateWeekSubtitle();
ensureNavBindings();

async function initSupabase() {
  if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
    console.log('Supabase not configured — running in local-only mode.');
    return;
  }

  try {
    window._supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const client = window._supabaseClient;

    const { data: recipesData, error: recipesError } = await client.from('recipes').select('*');
    if (!recipesError && Array.isArray(recipesData) && recipesData.length) {
      recipes = recipesData.map(r => ({
        id: r.id,
        name: r.name,
        description: r.description || '',
        time: r.time || '',
        servings: r.servings || '',
        ingredients: r.ingredients || [],
        directions: r.directions || [],
        sourceUrl: r.source_url || ''
      }));
    }

    const { data: weekData, error: weekError } = await client.from('weeks').select('*').eq('id', 'default').limit(1).maybeSingle();
    if (!weekError && weekData && weekData.plan) {
      week = weekData.plan;
    }

    localStorage.setItem('ourTableRecipes', JSON.stringify(recipes));
    localStorage.setItem('ourTableWeek', JSON.stringify(week));
    renderWeek();
    renderRecipeBox();
    renderGrocery();
    console.log('Supabase initialized — syncing with cloud.');
  } catch (error) {
    console.error('Supabase initialization failed', error);
  }
}

initSupabase();

</script>

</body>
</html>
